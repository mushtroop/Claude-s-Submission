<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monke Forest - WebXR Gorilla Tag Fan Game</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87c8ff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      max-width: 520px; padding: 14px 18px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.6); color: #fff; text-align: center; line-height: 1.45;
    }
    #info h1 { margin: 0 0 6px; font-size: 20px; }
    #info p { margin: 4px 0; font-size: 14px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <h1>Monke Forest</h1>
    <p>Open this page in the Quest 3 browser and press <b>Enter VR</b>.</p>
    <p>Push off surfaces with your hands to move. Swing your arms, let go to launch.</p>
    <p>Infection mode: you + 9 bots. Don't get tagged!</p>
    <p><b>A / X</b> = change plushie color &nbsp; <b>B / Y</b> = reset &nbsp; <b>Right stick</b> = turn</p>
  </div>
  <script type="module" src="./main.js?v=3"></script>
</body>
</html>
